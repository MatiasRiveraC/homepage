<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" rx="10" fill="#0e0f11"/>

  <!-- Monitor frame -->
  <rect x="6" y="8" width="52" height="36" rx="4" fill="none" stroke="#e8ff5a" stroke-width="2.5"/>

  <!-- Title bar -->
  <line x1="6" y1="20" x2="58" y2="20" stroke="#e8ff5a" stroke-width="2"/>

  <!-- Title bar dots -->
  <circle cx="13" cy="14" r="2.5" fill="#e8ff5a"/>
  <circle cx="21" cy="14" r="2.5" fill="#2a2c31"/>
  <circle cx="29" cy="14" r="2.5" fill="#2a2c31"/>

  <!-- Screen content: two "app" blocks -->
  <rect x="12" y="25" width="16" height="13" rx="2" fill="#e8ff5a" opacity="0.12"/>
  <rect x="12" y="25" width="16" height="13" rx="2" fill="none" stroke="#e8ff5a" stroke-width="1" opacity="0.4"/>

  <rect x="33" y="25" width="10" height="5" rx="1.5" fill="#e8ff5a" opacity="0.25"/>
  <rect x="33" y="33" width="15" height="5" rx="1.5" fill="#e8ff5a" opacity="0.15"/>

  <!-- Stand neck -->
  <line x1="32" y1="44" x2="32" y2="54" stroke="#2a2c31" stroke-width="5" stroke-linecap="round"/>

  <!-- Stand base -->
  <line x1="20" y1="54" x2="44" y2="54" stroke="#e8ff5a" stroke-width="3" stroke-linecap="round"/>

  <!-- Accent dot on screen -->
  <circle cx="20" cy="31.5" r="2" fill="#e8ff5a" opacity="0.6"/>
</svg>
