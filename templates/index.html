<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Homelab</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0e0f11;--surface:#161719;--surface2:#1c1e21;--border:#2a2c31;
      --accent:#e8ff5a;--red:#ff5a5a;--muted:#555860;--text:#d4d6db;--dim:#7c7f88;
      --mono:'Space Mono',monospace;--sans:'DM Sans',sans-serif;
      --on-accent:var(--bg);--frame-bg:var(--bg); /* passed to the Monitor tab; a theme may override them */
    }
    [data-theme="terminal"]{--bg:#0d1117;--surface:#161b22;--surface2:#1c2128;--border:#30363d;--accent:#39d353;--muted:#484f58;--text:#c9d1d9;--dim:#8b949e}
    [data-theme="nord"]{--bg:#2e3440;--surface:#3b4252;--surface2:#434c5e;--border:#4c566a;--accent:#88c0d0;--muted:#616e88;--text:#eceff4;--dim:#d8dee9}
    [data-theme="dracula"]{--bg:#282a36;--surface:#313341;--surface2:#3a3d4d;--border:#44475a;--accent:#bd93f9;--muted:#565869;--text:#f8f8f2;--dim:#a0a0b0}
    [data-theme="solarized"]{--bg:#002b36;--surface:#073642;--surface2:#0a4452;--border:#1a5464;--accent:#2aa198;--muted:#586e75;--text:#839496;--dim:#657b83}
    [data-theme="monokai"]{--bg:#1e1f1c;--surface:#272822;--surface2:#2f3025;--border:#3e3d32;--accent:#a6e22e;--muted:#565656;--text:#f8f8f2;--dim:#908080}
    [data-theme="tokyo"]{--bg:#1a1b26;--surface:#24283b;--surface2:#292e42;--border:#3b3f5c;--accent:#7aa2f7;--muted:#565f89;--text:#c0caf5;--dim:#9aa5ce}
    [data-theme="rose"]{--bg:#191724;--surface:#1f1d2e;--surface2:#26233a;--border:#393552;--accent:#eb6f92;--muted:#524f67;--text:#e0def4;--dim:#908caa}
    [data-theme="gruvbox"]{--bg:#1d2021;--surface:#282828;--surface2:#32302f;--border:#504945;--accent:#fabd2f;--muted:#665c54;--text:#ebdbb2;--dim:#a89984}
    [data-theme="catppuccin"]{--bg:#1e1e2e;--surface:#313244;--surface2:#45475a;--border:#585b70;--accent:#cba6f7;--muted:#6c7086;--text:#cdd6f4;--dim:#a6adc8}
    [data-theme="midnight"]{--bg:#0a0e1a;--surface:#111827;--surface2:#1a2336;--border:#1e3a5f;--accent:#38bdf8;--muted:#334155;--text:#e2e8f0;--dim:#94a3b8}
    [data-theme="forest"]{--bg:#0f1a0f;--surface:#162016;--surface2:#1c291c;--border:#2a3e2a;--accent:#86efac;--muted:#3d5c3d;--text:#d1fae5;--dim:#6ee7b7}
    [data-theme="amber"]{--bg:#0f0a00;--surface:#1a1200;--surface2:#261b00;--border:#3d2e00;--accent:#fbbf24;--muted:#5c4700;--text:#fef3c7;--dim:#d97706}
    [data-theme="ocean"]{--bg:#0c1821;--surface:#162433;--surface2:#1e3045;--border:#2a4a66;--accent:#06b6d4;--muted:#2d4f6a;--text:#cae0f0;--dim:#7ab8d4}
    [data-theme="slate"]{--bg:#0f172a;--surface:#1e293b;--surface2:#293548;--border:#334155;--accent:#f472b6;--muted:#475569;--text:#f1f5f9;--dim:#94a3b8}
    [data-theme="light"]{--bg:#f5f5f0;--surface:#ffffff;--surface2:#e8e8e2;--border:#d0d0c8;--accent:#1a1a1a;--muted:#aaaaa0;--text:#1a1a1a;--dim:#666660;--red:#dc2626}
    /* Retro: classic beveled desktop. Most of it is in static/retro-ui.css + static/retro-theme.css,
       loaded only while this theme is on (html.rb); these variables also colour the Monitor tab. */
    [data-theme="retro"]{--bg:#008080;--surface:#c0c0c0;--surface2:#dfdfdf;--border:#808080;--accent:#000080;--muted:#808080;--text:#000000;--dim:#404040;--red:#c00000;--on-accent:#ffffff;--frame-bg:#c0c0c0}
    /* Rust gloss: dark glossy windows. The look is in static/rust-theme.css, loaded only while this
       theme is on (html.rg); these variables also colour the Monitor tab, which adds its own window look. */
    [data-theme="rust"]{--bg:#121417;--surface:#343a42;--surface2:#2a2f35;--border:#56606b;--accent:#f97316;--muted:#8a939d;--text:#e6e9ed;--dim:#aab3bd;--red:#f87171;--on-accent:#1c0a02;--frame-bg:#121417}
    html:not(.rb) .rb-only{display:none!important}
    .app-window{display:contents} /* a real window only in the Retro and Rust gloss themes */

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column;transition:background .25s,color .25s}
    body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.04) 2px,rgba(0,0,0,.04) 4px);pointer-events:none;z-index:999}

    /* Header */
    header{display:flex;align-items:center;justify-content:space-between;padding:2rem 3rem 1.5rem;border-bottom:1px solid var(--border);position:relative;flex-shrink:0}
    header::after{content:'';position:absolute;bottom:-1px;left:3rem;width:60px;height:2px;background:var(--accent);transition:background .25s}
    .header-left{display:flex;align-items:center;gap:1.25rem}
    .site-logo{width:40px;height:40px;flex-shrink:0}
    .header-text{display:flex;flex-direction:column;gap:.15rem}
    .greeting{font-family:var(--mono);font-size:.62rem;color:var(--accent);letter-spacing:.15em;text-transform:uppercase;transition:color .25s}
    .site-title{font-family:var(--mono);font-size:1.8rem;font-weight:700;color:var(--text);letter-spacing:-.02em;line-height:1}
    .site-subtitle{font-size:.8rem;color:var(--dim);font-weight:300}
    .header-right{display:flex;align-items:center;gap:1.5rem}
    #clock{font-family:var(--mono);font-size:1.3rem;color:var(--dim);letter-spacing:.05em}
    #date{font-family:var(--mono);font-size:.6rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:.15rem}

    /* Palette button */
    .palette-btn{background:none;border:1px solid var(--border);color:var(--dim);font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;padding:.4rem .75rem;cursor:pointer;display:flex;align-items:center;gap:.5rem;transition:border-color .15s,color .15s}
    .palette-btn:hover{border-color:var(--accent);color:var(--accent)}
    .palette-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);transition:background .25s}

    /* ── Theme modal (full centered overlay) ── */
    .theme-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;align-items:center;justify-content:center}
    .theme-modal-overlay.open{display:flex}
    .theme-modal{background:var(--surface);border:1px solid var(--border);width:min(640px,92vw);max-height:80vh;display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(0,0,0,.6)}
    .theme-modal-header{display:flex;align-items:center;justify-content:space-between;padding:.85rem 1.25rem;border-bottom:1px solid var(--border);flex-shrink:0}
    .theme-modal-title{font-family:var(--mono);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
    .theme-modal-close{background:none;border:none;color:var(--dim);cursor:pointer;font-size:1.1rem;line-height:1;padding:.2rem .4rem;transition:color .15s}
    .theme-modal-close:hover{color:var(--text)}
    .theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;padding:1.25rem;overflow-y:auto}
    .theme-swatch{border:2px solid var(--border);padding:.75rem .875rem;cursor:pointer;display:flex;align-items:center;gap:.6rem;transition:border-color .15s,background .1s;background:var(--bg);text-align:left;width:100%}
    .theme-swatch:hover{border-color:var(--dim)}
    .theme-swatch.active{border-color:var(--accent)}
    .swatch-dots{display:flex;flex-direction:column;gap:3px;flex-shrink:0}
    .swatch-dot{width:22px;height:7px;border-radius:2px}
    .swatch-name{font-family:var(--mono);font-size:.58rem;letter-spacing:.05em;color:var(--text);text-transform:uppercase;line-height:1.3}

    /* Tabs */
    nav{display:flex;border-bottom:1px solid var(--border);padding:0 3rem;flex-shrink:0}
    .tab-btn{font-family:var(--mono);font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;padding:.75rem 1.25rem .75rem 0;margin-right:1.5rem;cursor:pointer;transition:color .15s,border-color .15s}
    .tab-btn:hover{color:var(--text)}
    .tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
    .tab-panel{display:none;flex:1}
    .tab-panel.active{display:flex;flex-direction:column}

    /* Dashboard */
    #panel-dashboard{padding:2.5rem 3rem;gap:2.5rem}
    .group{opacity:0;transform:translateY(8px);animation:fadeUp .4s ease forwards}
    @keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
    .group-label{font-family:var(--mono);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:.75rem;display:flex;align-items:center;gap:.75rem}
    .group-label::after{content:'';flex:1;height:1px;background:var(--border)}
    .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1px;border:1px solid var(--border)}
    .card{background:var(--surface);padding:1.25rem 1.5rem;display:flex;flex-direction:column;gap:.4rem;text-decoration:none;color:inherit;position:relative;overflow:hidden;border:1px solid transparent;margin:-1px;transition:background .15s,border-color .15s}
    .card::before{content:'';position:absolute;top:0;left:0;width:2px;height:0;background:var(--accent);transition:height .2s ease,background .25s}
    .card:hover{background:var(--surface2);border-color:var(--border);z-index:1}
    .card:hover::before{height:100%}
    .card:hover .card-name{color:var(--accent)}
    .card-icon{font-size:1.3rem;line-height:1;margin-bottom:.15rem}
    .card-name{font-family:var(--mono);font-size:.85rem;font-weight:700;color:var(--text);transition:color .15s}
    .card-desc{font-size:.75rem;color:var(--dim);font-weight:300}
    .card-url{font-family:var(--mono);font-size:.58rem;color:var(--muted);margin-top:auto;padding-top:.5rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    /* Editor */
    #panel-editor{padding:2rem 3rem;gap:1.5rem;overflow-y:auto}
    .editor-header{display:flex;align-items:center;justify-content:space-between}
    .editor-title{font-family:var(--mono);font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
    .editor-actions{display:flex;gap:.75rem;align-items:center}

    .btn{font-family:var(--mono);font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;padding:.5rem 1rem;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;transition:background .15s,border-color .15s,color .15s}
    .btn:hover{background:var(--surface2);border-color:var(--dim)}
    .btn-accent{background:var(--accent);color:var(--bg);border-color:var(--accent)}
    .btn-accent:hover{filter:brightness(1.1)}
    .btn-ghost{border-color:transparent;background:transparent;color:var(--dim)}
    .btn-ghost:hover{color:var(--text);border-color:var(--border)}

    #save-status{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;color:var(--muted);transition:color .3s}
    #save-status.ok{color:var(--accent)}
    #save-status.err{color:var(--red)}

    .editor-group{border:1px solid var(--border);background:var(--surface)}
    .editor-group-header{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1rem;border-bottom:1px solid var(--border);gap:1rem}
    .editor-group-name-wrap{display:flex;align-items:center;gap:.75rem;flex:1}
    .group-name-input{font-family:var(--mono);font-size:.8rem;font-weight:700;background:transparent;border:none;border-bottom:1px solid transparent;color:var(--text);outline:none;padding:.2rem .25rem;width:100%;max-width:220px;transition:border-color .15s}
    .group-name-input:focus{border-bottom-color:var(--accent)}
    .service-list{display:flex;flex-direction:column}
    .service-row{display:grid;grid-template-columns:3rem 1fr 1.5fr 1.8fr 2rem;gap:.5rem;align-items:center;padding:.6rem 1rem;border-bottom:1px solid var(--border);transition:background .1s}
    .service-row:last-child{border-bottom:none}
    .service-row:hover{background:var(--surface2)}
    .svc-input{font-family:var(--sans);font-size:.8rem;background:transparent;border:none;border-bottom:1px solid transparent;color:var(--text);outline:none;padding:.2rem .25rem;width:100%;transition:border-color .15s}
    .svc-input:focus{border-bottom-color:var(--accent)}
    .svc-input::placeholder{color:var(--muted)}
    .svc-delete{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;padding:.2rem;transition:color .15s}
    .svc-delete:hover{color:var(--red)}
    .service-row-header{display:grid;grid-template-columns:3rem 1fr 1.5fr 1.8fr 2rem;gap:.5rem;padding:.4rem 1rem;border-bottom:1px solid var(--border);background:var(--bg)}
    .service-row-header span{font-family:var(--mono);font-size:.55rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
    .add-service-btn{margin:.6rem 1rem;align-self:flex-start}
    .add-group-wrap{display:flex}

    /* ── Emoji picker button ── */
    .emoji-pick-btn{font-size:1.2rem;width:2.6rem;height:2.2rem;background:var(--surface2);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .15s;flex-shrink:0;border-radius:2px}
    .emoji-pick-btn:hover{border-color:var(--accent)}

    /* ── Emoji modal ── */
    .emoji-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:2000;align-items:center;justify-content:center}
    .emoji-modal-overlay.open{display:flex}
    .emoji-modal{background:var(--surface);border:1px solid var(--border);width:min(500px,92vw);max-height:70vh;display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(0,0,0,.6)}
    .emoji-modal-header{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1rem;border-bottom:1px solid var(--border);flex-shrink:0;gap:.75rem}
    .emoji-search{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:var(--sans);font-size:.85rem;padding:.4rem .75rem;outline:none;transition:border-color .15s}
    .emoji-search:focus{border-color:var(--accent)}
    .emoji-search::placeholder{color:var(--muted)}
    .emoji-modal-close{background:none;border:none;color:var(--dim);cursor:pointer;font-size:1.1rem;padding:.2rem .4rem;transition:color .15s}
    .emoji-modal-close:hover{color:var(--text)}
    .emoji-categories{display:flex;gap:0;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
    .emoji-cat-btn{background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);cursor:pointer;font-size:1rem;padding:.4rem .7rem;white-space:nowrap;transition:color .15s,border-color .15s}
    .emoji-cat-btn:hover{color:var(--text)}
    .emoji-cat-btn.active{border-bottom-color:var(--accent)}
    .emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(2.6rem,1fr));gap:2px;padding:.75rem;overflow-y:auto;flex:1}
    .emoji-btn{background:none;border:1px solid transparent;font-size:1.35rem;width:2.6rem;height:2.6rem;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:3px;transition:background .1s,border-color .1s}
    .emoji-btn:hover{background:var(--surface2);border-color:var(--border)}
    .emoji-no-results{font-family:var(--mono);font-size:.65rem;color:var(--muted);padding:2rem;text-align:center;letter-spacing:.1em}

    /* Monitor tab: the homelab monitor (monitor LXC) shown inside this page via /monitor/ */
    #panel-monitor{padding:0}
    #monitor-frame{flex:1;width:100%;min-height:calc(100vh - 160px);border:0;background:var(--bg)}

    /* Live server status on the dashboard */
    .status-strip{display:flex;align-items:center;gap:1rem;padding:.85rem 1.25rem;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;transition:border-color .15s}
    .status-strip:hover{border-color:var(--accent)}
    .status-dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex-shrink:0}
    .status-dot.ok{background:#22c55e}.status-dot.warning{background:#f59e0b}.status-dot.critical{background:var(--red)}
    .status-text{color:var(--text);font-weight:700}
    .status-sub{color:var(--dim)}
    .status-counts{margin-left:auto;display:flex;gap:1rem;color:var(--dim)}
    .status-counts b.crit{color:var(--red)}.status-counts b.warn{color:#f59e0b}

    /* Footer */
    footer{padding:1.25rem 3rem;border-top:1px solid var(--border);font-family:var(--mono);font-size:.58rem;color:var(--muted);letter-spacing:.1em;display:flex;justify-content:space-between;flex-shrink:0}

    @media(max-width:700px){
      header,nav,#panel-dashboard,#panel-editor,footer{padding-left:1.25rem;padding-right:1.25rem}
      .site-title{font-size:1.4rem}
      .cards{grid-template-columns:1fr 1fr}
      .service-row,.service-row-header{grid-template-columns:2.6rem 1fr 1fr}
      .service-row .svc-desc,.service-row-header .col-desc{display:none}
      .theme-grid{grid-template-columns:repeat(2,1fr)}
    }
  </style>
  <link rel="stylesheet" id="rb-css" href="/static/retro-ui.css" media="not all">
  <link rel="stylesheet" id="rb-theme-css" href="/static/retro-theme.css" media="not all">
  <link rel="stylesheet" id="rg-css" href="/static/rust-theme.css" media="not all">
  <script>
    // Apply the saved theme before the first paint (Retro and Rust gloss also switch on their stylesheets)
    (function(){
      var t; try { t = localStorage.getItem('hl-theme'); } catch(e) {}
      if (t && t !== 'default') document.documentElement.dataset.theme = t;
      if (t === 'retro') {
        document.documentElement.classList.add('rb');
        document.getElementById('rb-css').media = document.getElementById('rb-theme-css').media = 'all';
      }
      if (t === 'rust') {
        document.documentElement.classList.add('rg');
        document.getElementById('rg-css').media = 'all';
      }
    })();
  </script>
</head>
<body>

<!-- Pixel icons for the Retro theme's taskbar and menu -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-computer" viewBox="0 0 16 16" shape-rendering="crispEdges">
    <rect x="1" y="1" width="14" height="10" fill="#c0c0c0" stroke="#000"/><rect x="3" y="3" width="10" height="6" fill="#008080" stroke="#808080"/>
    <rect x="5" y="12" width="6" height="2" fill="#c0c0c0" stroke="#000"/><rect x="3" y="14" width="10" height="1" fill="#000"/>
  </symbol>
  <symbol id="i-folder" viewBox="0 0 16 16" shape-rendering="crispEdges">
    <path d="M1 3h5l1 2h8v9H1z" fill="#ffff80" stroke="#000"/><path d="M2 7h12" stroke="#fff"/>
  </symbol>
  <symbol id="i-doc" viewBox="0 0 16 16" shape-rendering="crispEdges">
    <path d="M3 1h7l3 3v11H3z" fill="#fff" stroke="#000"/><path d="M10 1v3h3" fill="#c0c0c0" stroke="#000"/>
    <path d="M5 7h6M5 9h6M5 11h6" stroke="#808080"/>
  </symbol>
  <symbol id="i-palette" viewBox="0 0 16 16" shape-rendering="crispEdges">
    <path d="M3 1h9l3 3v6l-2 2H9v3H5l-4-4V3z" fill="#c0c0c0" stroke="#000"/>
    <rect x="4" y="4" width="2" height="2" fill="#f00"/><rect x="8" y="3" width="2" height="2" fill="#0c0"/>
    <rect x="11" y="6" width="2" height="2" fill="#00f"/><rect x="4" y="8" width="2" height="2" fill="#ff0"/>
  </symbol>
  <symbol id="i-menu" viewBox="0 0 16 16" shape-rendering="crispEdges">
    <path d="M8 1l2 5h5l-4 3 2 6-5-4-5 4 2-6-4-3h5z" fill="#ffff00" stroke="#000"/>
  </symbol>
</svg>

<div class="app-window" id="app-window">
<header>
  <div class="header-left">
    <img src="/favicon.svg" class="site-logo" alt="logo">
    <div class="header-text">
      <span class="greeting" id="greeting"></span>
      <h1 class="site-title" id="site-title">Homelab</h1>
      <p class="site-subtitle" id="site-subtitle"></p>
    </div>
  </div>
  <div class="header-right">
    <div><div id="clock">--:--:--</div><div id="date"></div></div>
    <button class="palette-btn" id="palette-btn"><span class="palette-dot"></span>Theme</button>
    <div class="rb-only title-bar-controls">
      <button aria-label="Minimize" id="rb-min" title="Minimize"></button>
      <button aria-label="Restore" id="rb-max" title="Restore / maximize"></button>
      <button aria-label="Close" disabled title="The homepage stays open"></button>
    </div>
  </div>
</header>

<!-- Theme modal -->
<div class="theme-modal-overlay" id="theme-modal-overlay">
  <div class="theme-modal">
    <div class="theme-modal-header">

const THEME_KEY = 'hl-theme';
let currentTheme = localStorage.getItem(THEME_KEY) || 'default';

function applyTheme(id) {
  currentTheme = id;
  document.documentElement.dataset.theme = id === 'default' ? '' : id;
  const retro = id === 'retro';
  document.documentElement.classList.toggle('rb', retro);
  ['rb-css','rb-theme-css'].forEach(l => document.getElementById(l).media = retro ? 'all' : 'not all');
  const rust = id === 'rust';
  document.documentElement.classList.toggle('rg', rust);
  document.getElementById('rg-css').media = rust ? 'all' : 'not all';
  localStorage.setItem(THEME_KEY, id);
  document.querySelectorAll('.theme-swatch').forEach(s => s.classList.toggle('active', s.dataset.theme === id));
  syncMonitorTheme();
}

// The monitor page (same origin through /monitor/) takes this page's theme colours
const MONITOR_THEME_VARS = {'--bg':'--frame-bg','--panel':'--surface','--panel-2':'--surface2','--border':'--border',
  '--text':'--text','--muted':'--dim','--accent':'--accent','--on-accent':'--on-accent','--crit':'--red'};
function syncMonitorTheme(){
  const frame = document.getElementById('monitor-frame');
  const doc = frame && frame.contentDocument;
  if (!doc || !doc.documentElement) return;
  const cs = getComputedStyle(document.documentElement);
  for (const [monitorVar, ownVar] of Object.entries(MONITOR_THEME_VARS))
    doc.documentElement.style.setProperty(monitorVar, cs.getPropertyValue(ownVar).trim());
  doc.documentElement.classList.toggle('theme-retro', currentTheme === 'retro'); // its bevelled look
  doc.documentElement.classList.toggle('theme-rust', currentTheme === 'rust');   // its dark glossy windows
}

function buildThemeGrid() {
  const grid = document.getElementById('theme-grid');
  THEMES.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'theme-swatch' + (t.id === currentTheme ? ' active' : '');
    btn.dataset.theme = t.id;
    btn.innerHTML = `
      <div class="swatch-dots">
        <div class="swatch-dot" style="background:${t.bg};outline:1px solid rgba(255,255,255,.15)"></div>
        <div class="swatch-dot" style="background:${t.surface}"></div>
        <div class="swatch-dot" style="background:${t.accent}"></div>
      </div>
      <span class="swatch-name">${t.name}</span>`;
    btn.addEventListener('click', () => { applyTheme(t.id); closeThemeModal(); });
    grid.appendChild(btn);
  });
}

  { label:'🍕 Food',   emojis:['🍕','🍔','🍟','🌭','🥪','🌮','🌯','🥙','🧆','🥚','🍳','🥘','🍲','🥣','🥗','🍿','🧂','🥫','🍱','🍣','🍜','🍝','🍛','🍚','🍙','🧇','🥞','🧈','🍩','🍪'] },
];

let emojiTarget = null; // the button that opened the picker

function buildEmojiPicker() {
  const cats = document.getElementById('emoji-categories');
  EMOJI_CATS.forEach((cat, i) => {
    const btn = document.createElement('button');
    btn.className = 'emoji-cat-btn' + (i === 0 ? ' active' : '');
    btn.textContent = cat.label;
    btn.addEventListener('click', () => {
      document.querySelectorAll('.emoji-cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('emoji-search').value = '';
      renderEmojiGrid(cat.emojis);
    });
    cats.appendChild(btn);
  });
  renderEmojiGrid(EMOJI_CATS[0].emojis);
}

function renderEmojiGrid(emojis) {
  const grid = document.getElementById('emoji-grid');
  grid.innerHTML = '';
  if (!emojis.length) {
    grid.innerHTML = '<div class="emoji-no-results">No results</div>';
    return;
  }
  emojis.forEach(em => {
    const btn = document.createElement('button');
    btn.className = 'emoji-btn';
    btn.textContent = em;
    btn.title = em;
    btn.addEventListener('click', () => selectEmoji(em));
    grid.appendChild(btn);
  });
}

function selectEmoji(em) {
  if (emojiTarget) {
    emojiTarget.textContent = em;
    // Update config state
    const gi = parseInt(emojiTarget.dataset.gi);
    const si = parseInt(emojiTarget.dataset.si);
    config.groups[gi].services[si].icon = em;
  }
  closeEmojiModal();
}

document.getElementById('emoji-search').addEventListener('input', e => {
  const q = e.target.value.toLowerCase().trim();
  if (!q) { renderEmojiGrid(EMOJI_CATS[0].emojis); return; }
  const all = EMOJI_CATS.flatMap(c => c.emojis);
  // simple filter: match if the emoji name contains query (we search via codepoint description trick)
  // Since we don't have names, just show all and let user browse; filter by visible match
  renderEmojiGrid(all.filter((em, i, arr) => arr.indexOf(em) === i));
});

const emojiOverlay = document.getElementById('emoji-modal-overlay');
document.getElementById('emoji-modal-close').addEventListener('click', closeEmojiModal);
emojiOverlay.addEventListener('click', e => { if(e.target === emojiOverlay) closeEmojiModal(); });
function openEmojiModal(btn){ emojiTarget = btn; emojiOverlay.classList.add('open'); document.getElementById('emoji-search').focus(); }
function closeEmojiModal(){ emojiOverlay.classList.remove('open'); emojiTarget = null; }

// ── State ──────────────────────────────────────────────────────────────────
let config = {};

// ── Clock ──────────────────────────────────────────────────────────────────
function updateClock(){
  const n=new Date();
  document.getElementById('clock').textContent=n.toLocaleTimeString('en-GB',{hour12:false});
  document.getElementById('date').textContent=n.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'}).toUpperCase();
  document.getElementById('rb-clock').textContent=n.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}
updateClock(); setInterval(updateClock,1000);

// ── Tabs ───────────────────────────────────────────────────────────────────
function openTab(tab, monitorView){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+tab).classList.add('active');
  history.replaceState(null, '', tab==='dashboard' ? location.pathname : '#'+tab);
  if(tab==='editor') renderEditor();
  if(tab==='dashboard') loadStatus();
  if(tab==='monitor'){
    const frame=document.getElementById('monitor-frame');
    if(!frame.getAttribute('src')) frame.src='/monitor/?embed=1#'+(monitorView||'overview');
    else if(monitorView) frame.contentWindow.location.hash=monitorView;
  }
}
document.querySelectorAll('.tab-btn').forEach(btn=>btn.addEventListener('click',()=>openTab(btn.dataset.tab)));
document.getElementById('monitor-frame').addEventListener('load', syncMonitorTheme);

// ── Server status (from the homelab monitor) ──────────────────────────────
let serverStatus = null;
async function loadStatus(){
  if(!monitorEnabled) return;
  try{
    const res = await fetch('/monitor/api/overview', {credentials:'same-origin'});
    if(res.status===401) serverStatus = {login:true};
    else if(!res.ok) serverStatus = {down:true};
    else serverStatus = await res.json();
  }catch{ serverStatus = {down:true}; }
  renderStatus();
}
function renderStatus(){
  const strip = document.getElementById('status-strip');
  if(!strip || !serverStatus) return;
  const s = serverStatus;
  if(s.login){ strip.innerHTML='<span class="status-dot"></span><span class="status-text">Server status</span><span class="status-sub">Sign in to the monitor to see it</span>'; return; }
  if(s.down){ strip.innerHTML='<span class="status-dot critical"></span><span class="status-text">Monitor unreachable</span><span class="status-sub">The homelab monitor (LXC 105) does not answer</span>'; return; }
  const cls = s.verdict==='All good' ? 'ok' : s.verdict==='Needs attention' ? 'warning' : 'critical';
  const healthy = (s.collectors||[]).filter(c=>c.last_ok).length;
  strip.innerHTML=`<span class="status-dot ${cls}"></span><span class="status-text">${esc(s.verdict)}</span>
    <span class="status-counts"><span><b class="crit">${s.counts.critical}</b> critical</span><span><b class="warn">${s.counts.warning}</b> warnings</span>
    <span>${healthy}/${(s.collectors||[]).length} collectors</span></span>`;
}
setInterval(loadStatus, 60000);

// ── Load config ────────────────────────────────────────────────────────────
async function loadConfig(){
  const res=await fetch('/api/config');
  config=await res.json();
  renderDashboard(); updateFooter();
  const site=config.site||{};
  document.title=site.title||'Homelab';
  document.getElementById('site-title').textContent=site.title||'Homelab';
  document.getElementById('site-subtitle').textContent=site.subtitle||'';
  document.getElementById('greeting').textContent=site.greeting||'';
}

// ── Dashboard ──────────────────────────────────────────────────────────────
let monitorEnabled = false; // set from /api/features (MONITOR_URL configured)

function renderDashboard(){
  const panel=document.getElementById('panel-dashboard');
  panel.innerHTML='';
  if(monitorEnabled){
    const strip=document.createElement('div');
    strip.className='status-strip'; strip.id='status-strip'; strip.title='Open the monitor';
    strip.innerHTML='<span class="status-dot"></span><span class="status-sub">Checking the server…</span>';
    strip.addEventListener('click',()=>openTab('monitor','overview'));
    panel.appendChild(strip);
    renderStatus();
  }
  (config.groups||[]).forEach((group,gi)=>{
    const section=document.createElement('section');
    section.className='group';
    section.style.animationDelay=`${gi*.07}s`;
    const label=document.createElement('div');
    label.className='group-label';
    label.textContent=group.name||'Services';
    section.appendChild(label);
    const grid=document.createElement('div');
    grid.className='cards';
    (group.services||[]).forEach(svc=>{
      const a=document.createElement('a');
      a.className='card';
      a.href=svc.url||'#';
      a.target='_blank';
      a.rel='noopener noreferrer';
      a.title=[svc.description, svc.url].filter(Boolean).join('\n');
      a.innerHTML=`
        <div class="card-icon">${svc.icon||'⬡'}</div>
        <div class="card-name">${svc.name||''}</div>
        ${svc.description?`<div class="card-desc">${svc.description}</div>`:''}
        <div class="card-url">${(svc.url||'').replace(/^https?:\/\//,'')}</div>`;
      grid.appendChild(a);
    });
    section.appendChild(grid);
    panel.appendChild(section);
  });
}

// ── Editor ─────────────────────────────────────────────────────────────────
function renderEditor(){
  const container=document.getElementById('editor-groups');
  container.innerHTML='';
  (config.groups||[]).forEach((group,gi)=>renderGroup(container,group,gi));
}

function renderGroup(container,group,gi){
  const wrap=document.createElement('div');
  wrap.className='editor-group';
  wrap.innerHTML=`
    <div class="editor-group-header">
      <div class="editor-group-name-wrap">
        <input class="group-name-input" type="text" value="${esc(group.name||'')}" placeholder="Group name" data-gi="${gi}">
      </div>
      <button class="btn btn-ghost btn-delete-group" data-gi="${gi}">Delete group</button>
    </div>
    <div class="service-row-header">
      <span>Icon</span><span>Name</span><span>URL</span><span class="col-desc">Description</span><span></span>
    </div>
    <div class="service-list" id="service-list-${gi}"></div>
    <button class="btn btn-ghost add-service-btn" data-gi="${gi}" style="margin:.6rem 1rem">+ Add service</button>`;
  container.appendChild(wrap);
  wrap.querySelector('.group-name-input').addEventListener('input',e=>{ config.groups[e.target.dataset.gi].name=e.target.value; });
  wrap.querySelector('.btn-delete-group').addEventListener('click',e=>{
    config.groups.splice(parseInt(e.target.dataset.gi),1);
    renderEditor(); updateFooter();
  });
  wrap.querySelector('.add-service-btn').addEventListener('click',e=>{
    const idx=parseInt(e.target.dataset.gi);
    if(!config.groups[idx].services) config.groups[idx].services=[];
    config.groups[idx].services.push({icon:'⬡',name:'',url:'',description:''});
    renderEditor();
  });
  const list=wrap.querySelector(`#service-list-${gi}`);
  (group.services||[]).forEach((svc,si)=>renderService(list,svc,gi,si));
}

function renderService(list,svc,gi,si){
  const row=document.createElement('div');
  row.className='service-row';

  // Emoji pick button
  const emojiBtn=document.createElement('button');
  emojiBtn.className='emoji-pick-btn';
  emojiBtn.textContent=svc.icon||'⬡';
  emojiBtn.title='Pick emoji';
  emojiBtn.dataset.gi=gi;
  emojiBtn.dataset.si=si;
  emojiBtn.addEventListener('click',()=>openEmojiModal(emojiBtn));

  const mkInput=(field,placeholder,extraClass='')=>{
    const inp=document.createElement('input');
    inp.type='text'; inp.className='svc-input '+extraClass;
    inp.value=svc[field]||''; inp.placeholder=placeholder; // a value, not HTML: no escaping
    inp.dataset.gi=gi; inp.dataset.si=si; inp.dataset.field=field;
    inp.addEventListener('input',e=>{ config.groups[gi].services[si][field]=e.target.value; });
    return inp;
  };

  const delBtn=document.createElement('button');
  delBtn.className='svc-delete'; delBtn.title='Delete'; delBtn.textContent='✕';
  delBtn.addEventListener('click',()=>{ config.groups[gi].services.splice(si,1); renderEditor(); });

  row.appendChild(emojiBtn);
  row.appendChild(mkInput('name','Name'));
  row.appendChild(mkInput('url','http://...'));
  row.appendChild(mkInput('description','Description','svc-desc'));
  row.appendChild(delBtn);
  list.appendChild(row);
}

document.getElementById('btn-add-group').addEventListener('click',()=>{
  if(!config.groups) config.groups=[];
  config.groups.push({name:'New group',services:[]});
  renderEditor();
});

document.getElementById('btn-save').addEventListener('click',async()=>{
  const status=document.getElementById('save-status');
  status.textContent='Saving…'; status.className='';
  try{
    const res=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(config)});
    if(!res.ok) throw new Error();
    status.textContent='Saved ✓'; status.className='ok';
    renderDashboard(); updateFooter();
    setTimeout(()=>{status.textContent='';status.className='';},2500);
  }catch{ status.textContent='Error saving'; status.className='err'; }
});

function updateFooter(){
  const groups=config.groups||[];
  const total=groups.reduce((n,g)=>n+(g.services||[]).length,0);
  document.getElementById('footer-count').textContent=`${total} service${total!==1?'s':''} / ${groups.length} group${groups.length!==1?'s':''}`;
}

function esc(str){ return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Retro theme: window buttons, taskbar and menu (.rb-only elements) ──────
const appWindow=document.getElementById('app-window'), rbTask=document.getElementById('rb-task'), rbMax=document.getElementById('rb-max');
function setMinimized(min){ appWindow.classList.toggle('minimized', min); rbTask.classList.toggle('active', !min); }
document.getElementById('rb-min').addEventListener('click', ()=>setMinimized(true));
rbTask.addEventListener('click', ()=>setMinimized(!appWindow.classList.contains('minimized')));
function toggleMaximized(){ const restored=appWindow.classList.toggle('restored'); rbMax.setAttribute('aria-label', restored ? 'Maximize' : 'Restore'); }
rbMax.addEventListener('click', toggleMaximized);
document.querySelector('header').addEventListener('dblclick', ()=>{ if(currentTheme==='retro') toggleMaximized(); });

const rbMenu=document.getElementById('rb-menu'), rbMenuBtn=document.getElementById('rb-menu-btn');
function setRbMenu(open){ rbMenu.classList.toggle('open', open); rbMenuBtn.classList.toggle('active', open); }
rbMenuBtn.addEventListener('click', e=>{ e.stopPropagation(); setRbMenu(!rbMenu.classList.contains('open')); });
document.addEventListener('click', e=>{ if(!rbMenu.contains(e.target)) setRbMenu(false); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') setRbMenu(false); });
rbMenu.querySelectorAll('.entry').forEach(entry=>{
  const run=()=>{
    setRbMenu(false);
    if(entry.dataset.action==='theme'){ themeOverlay.classList.add('open'); return; }
    setMinimized(false); openTab(entry.dataset.tab);
  };
  entry.addEventListener('click', e=>{ e.stopPropagation(); run(); });
  entry.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); run(); } });
});

// ── Init ───────────────────────────────────────────────────────────────────
async function init(){
  try{ monitorEnabled = (await (await fetch('/api/features')).json()).monitor; }catch{ monitorEnabled = false; }
  document.querySelector('.tab-btn[data-tab="monitor"]').style.display = monitorEnabled ? '' : 'none';
  document.querySelector('#rb-menu [data-tab="monitor"]').style.display = monitorEnabled ? '' : 'none';
  await loadConfig();
  loadStatus();
  if(location.hash==='#monitor' && monitorEnabled) openTab('monitor');
  else if(location.hash==='#editor') openTab('editor');
}
buildThemeGrid();
buildEmojiPicker();
applyTheme(currentTheme);
init();
</script>
</body>
</html>
